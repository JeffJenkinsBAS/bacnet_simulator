<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Automated Controls Inc logo">
  <!-- Vector recreation of the ACI round logo (green ring, navy "ac",
       Nashville skyline band). If the original raster asset is preferred,
       drop it in static/ and point the dashboard's <img> at it instead. -->
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="94"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="96.5" fill="#ffffff" stroke="#1e8a3c" stroke-width="3"/>
  <g clip-path="url(#disc)">
    <!-- skyline band -->
    <g fill="#6b8cb8">
      <rect x="4"   y="108" width="14" height="34"/>
      <rect x="20"  y="96"  width="12" height="46"/>
      <rect x="34"  y="116" width="16" height="26"/>
      <rect x="52"  y="102" width="12" height="40"/>
      <rect x="66"  y="112" width="14" height="30"/>
      <rect x="82"  y="94"  width="12" height="48"/>
      <rect x="96"  y="108" width="14" height="34"/>
      <rect x="112" y="99"  width="12" height="43"/>
      <rect x="126" y="112" width="14" height="30"/>
      <rect x="142" y="104" width="14" height="38"/>
      <rect x="158" y="92"  width="12" height="50"/>
      <!-- twin-spire tower -->
      <rect x="172" y="96" width="14" height="46"/>
      <rect x="172" y="80" width="3.5" height="18"/>
      <rect x="182.5" y="80" width="3.5" height="18"/>
      <rect x="4" y="136" width="192" height="10"/>
    </g>
    <!-- letters -->
    <text x="99" y="138" text-anchor="middle"
          font-family="'Cooper Black','Bookman Old Style',Georgia,'Times New Roman',serif"
          font-size="124" font-weight="900" letter-spacing="-6"
          fill="#1d4f9c" stroke="#ffffff" stroke-width="3" paint-order="stroke">ac</text>
  </g>
</svg>
